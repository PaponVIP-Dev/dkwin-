<!-- ===== FIREBASE SDK ===== -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
/* ============================================================
   1. GLOBAL RESET & THEME
============================================================ */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial Black', 'Arial', sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
body{background:#000;overflow:hidden;height:100vh;}
iframe{width:100%;height:100%;border:none;pointer-events:auto;}

/* ============================================================
   2. TOP TICKER BAR
============================================================ */
#topTicker{position:fixed;top:0;left:0;right:0;z-index:10000;height:24px;
  display:flex;align-items:center;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,32,10,.96),rgba(0,12,4,.96));
  border-bottom:1px solid rgba(0,255,65,.4);
  box-shadow:0 4px 18px rgba(0,0,0,.8);}
.ticker-track{display:inline-flex;white-space:nowrap;animation:tMove 22s linear infinite;}
.ticker-item{font-size:10px;font-weight:900;letter-spacing:3px;color:#00ff88;
  padding-left:35px;text-shadow:0 0 10px rgba(0,255,136,.6);text-transform:uppercase;}
@keyframes tMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============================================================
   3. COMPACT FLOATING PANEL (SMALLER SIZE)
============================================================ */
.float-panel{
  --D:min(260px, 72vw); /* Smaller & sleek panel design */
  position:fixed;z-index:9999;
  width:var(--D);height:var(--D);
  border-radius:50%;
  padding:calc(var(--D)*.025);
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  touch-action:none;cursor:grab;
}
.float-panel:active{cursor:grabbing;}

/* ============================================================
   4. INNER CIRCLE SCREEN DESIGN
============================================================ */
.screen-box{
  position:relative;border-radius:50%;overflow:hidden;
  width:calc(var(--D)*.88);height:calc(var(--D)*.88);
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(0,255,65,.65);
  background:
    repeating-linear-gradient(0deg,rgba(0,255,65,.05) 0 1px,transparent 1px 12px),
    repeating-linear-gradient(90deg,rgba(0,255,65,.05) 0 1px,transparent 1px 12px),
    radial-gradient(circle at 50% 50%,rgba(0,255,65,.15),rgba(0,12,4,.96) 75%);
  box-shadow:inset 0 0 25px rgba(0,255,65,.25),0 8px 24px rgba(0,0,0,.8);
}
.screen-box::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,255,65,.15),transparent);
  animation:shine 3.5s ease-in-out infinite;pointer-events:none;}
@keyframes shine{0%{left:-100%}60%{left:140%}100%{left:140%}}

#sigCircle{position:absolute;inset:4px;border-radius:50%;
  border:2px dashed rgba(0,255,65,.85);
  box-shadow:0 0 16px rgba(0,255,65,.4),inset 0 0 10px rgba(0,255,65,.2);
  opacity:0;pointer-events:none;transition:opacity .3s;
  animation:spin 9s linear infinite;}
#sigCircle.on{opacity:1;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   5. LOCK SCREEN
============================================================ */
#lockScreen{position:absolute;inset:0;z-index:5;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:radial-gradient(circle,rgba(0,22,8,.96),rgba(0,6,2,.98));border-radius:50%;}
.fp-ico{filter:drop-shadow(0 0 8px rgba(0,255,65,.8));animation:coreBlink 2s infinite;}
.lock-text{font-size:7.5px;font-weight:900;letter-spacing:1.5px;color:rgba(0,255,120,.9);text-transform:uppercase;}
#keyInput{width:75%;padding:5px 8px;text-align:center;
  background:rgba(0,30,10,.9);border:1.5px solid rgba(0,255,65,.5);color:#00ff41;
  border-radius:10px;font-size:11px;font-weight:800;letter-spacing:3px;outline:none;}
#keyInput::placeholder{color:rgba(0,255,65,.35);letter-spacing:2px;}
#keyInput:focus{border-color:#00ff41;box-shadow:0 0 14px rgba(0,255,0,.4);}
.btn{border-radius:10px;padding:5px 15px;font-size:8.5px;font-weight:900;letter-spacing:1px;
  cursor:pointer;transition:transform .1s;border:none;}
.btn:active{transform:scale(.95);}
#btnUnlock{background:linear-gradient(135deg,#00ff41,#00a020);color:#001a00;
  box-shadow:0 0 14px rgba(0,255,65,.5);}
#lockScreen.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.key-err{color:#ff4444;font-size:7.5px;font-weight:900;letter-spacing:1px;display:none;}

/* ============================================================
   6. OFFLINE SCREEN
============================================================ */
#offlineScreen{position:absolute;inset:0;display:none;z-index:2;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.diamond{position:absolute;left:50%;top:50%;width:50px;height:50px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:2px solid rgba(0,255,65,.5);border-radius:8px;
  box-shadow:0 0 16px rgba(0,255,65,.35),inset 0 0 10px rgba(0,255,65,.2);
  animation:diaPulse 2.4s ease-in-out infinite;pointer-events:none;}
@keyframes diaPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) rotate(45deg) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(1.05)}}
.server-text{font-size:9.5px;font-weight:900;letter-spacing:2px;color:#fff;
  text-shadow:0 0 12px rgba(255,255,255,.8);position:relative;}
.contact-text{font-size:6.5px;font-weight:900;letter-spacing:1.2px;color:#39c8ff;
  margin-top:2px;text-shadow:0 0 10px rgba(57,200,255,.6);position:relative;}

/* ============================================================
   7. LIVE SCREEN & HEADERS
============================================================ */
#liveScreen{position:absolute;inset:0;display:none;z-index:2;
  flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--D)*.008);text-align:center;padding:calc(var(--D)*.03);}
.live-top{display:flex;justify-content:center;align-items:center;gap:5px;}
#timer{font-size:calc(var(--D)*.068);font-weight:900;color:#ffffff;font-variant-numeric:tabular-nums;
  letter-spacing:1.5px;text-shadow:0 0 14px rgba(0,255,90,.7);}
.live-dot{font-size:6.5px;font-weight:900;letter-spacing:1px;color:#001a00;
  background:#00ff41;padding:2px 5px;border-radius:5px;
  box-shadow:0 0 10px rgba(0,255,65,.8);animation:coreBlink 1.6s infinite;}
@keyframes coreBlink{0%,100%{opacity:1}50%{opacity:.35}}

.header-market-line {
  font-size: 7.5px;
  font-weight: 900;
  letter-spacing: 1.5px;
  color: #00ff88;
  text-transform: uppercase;
  text-shadow: 0 0 8px rgba(0,255,136,.6);
  white-space: nowrap;
}
.period-line{
  font-size:7px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.85);
  word-break:break-all;line-height:1.2;max-width:98%;text-transform:uppercase;
}
.period-line b{color:#00ff88;}

/* ============================================================
   8. SIGNAL TEXT & NUMBER SHORT
============================================================ */
#signalWrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
}
#signalNumber{
  display:block;
  font-family:'Arial Black', sans-serif;
  font-size:calc(var(--D)*.11);
  font-weight:900;
  line-height:1;
  letter-spacing:2px; 
  padding:0;
  border:none;
  transition:all .3s;
  text-align:center;
  color:#ffd700;
  text-shadow:0 0 12px rgba(255, 215, 0, 0.8);
}

.num-badge {
  font-size: calc(var(--D)*.045);
  font-weight: 900;
  color: #00ffff;
  letter-spacing: 1.5px;
  text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
}

.acc-text {
  font-size: 7px;
  font-weight: 900;
  color: #ff00ff;
  letter-spacing: 1px;
  text-shadow: 0 0 6px rgba(255, 0, 255, 0.6);
}

#sigPeriodNum{
  display:block;
  font-size:calc(var(--D)*.035);
  font-weight:800;
  color:rgba(0,255,120,.9);
  letter-spacing:1px;
  margin-top:2px;
  word-break:break-all;
}

#matchBadge{font-size:7.5px;font-weight:900;letter-spacing:1.5px;
  padding:2px 8px;border-radius:6px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#889;text-transform:uppercase;}
#matchBadge.READY{color:#001a00;background:linear-gradient(135deg,#39ff7a,#00c853);
  border-color:rgba(0,255,65,.8);box-shadow:0 0 14px rgba(0,255,65,.7);}
#matchBadge.WAIT{color:#ffaa00;border-color:rgba(255,170,0,.4);animation:coreBlink 1s infinite;}

/* RESULT OVERLAY (WIN / LOSS) */
#resultOverlay{
  position:absolute;inset:0;z-index:10;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  border-radius:50%;animation:popIn .3s ease-out;
}
#resultOverlay.WIN{
  background:radial-gradient(circle, rgba(0,255,65,.92), rgba(0,80,20,.96));
  box-shadow:0 0 30px rgba(0,255,65,.8);
}
#resultOverlay.LOSS{
  background:radial-gradient(circle, rgba(255,34,68,.92), rgba(80,0,10,.96));
  box-shadow:0 0 30px rgba(255,34,68,.8);
}
.res-title{font-size:calc(var(--D)*.12);font-weight:900;color:#fff;letter-spacing:3px;text-shadow:0 0 15px rgba(0,0,0,.8);}
.res-sub{font-size:8px;font-weight:900;color:#fff;letter-spacing:1.5px;margin-top:2px;}

@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* ============================================================
   9. ANALYZING RADAR UI
============================================================ */
#analyzingBox{display:none;text-align:center;}
.radar{position:relative;width:calc(var(--D)*.2);height:calc(var(--D)*.2);
  margin:2px auto 3px;border-radius:50%;
  border:2px solid rgba(0,255,65,.5);
  background:radial-gradient(circle,rgba(0,255,65,.1),rgba(0,10,3,.7) 72%);
  box-shadow:0 0 18px rgba(0,255,65,.4),inset 0 0 12px rgba(0,255,65,.2);}
.r-grid{position:absolute;inset:0;border-radius:50%;
  background:
    linear-gradient(rgba(0,255,65,.2),rgba(0,255,65,.2)) 50% 0/1px 100% no-repeat,
    linear-gradient(rgba(0,255,65,.2),rgba(0,255,65,.2)) 0 50%/100% 1px no-repeat;}
.r-ring{position:absolute;inset:calc(var(--D)*.04);border-radius:50%;
  border:1.2px dashed rgba(0,255,65,.55);animation:spin 5s linear infinite;}
.r-sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(0,255,65,.85),rgba(0,255,65,.1) 70deg,transparent 130deg);
  animation:spin 1.2s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 24%,#000 25%);
          mask:radial-gradient(circle,transparent 24%,#000 25%);}
.r-core{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  border-radius:50%;background:#00ff41;
  box-shadow:0 0 10px #00ff41,0 0 20px rgba(0,255,65,.8);
  animation:coreBlink .9s ease-in-out infinite;}
.ana-label{font-size:calc(var(--D)*.038);font-weight:900;letter-spacing:2px;color:#ffaa00;
  text-shadow:0 0 15px rgba(255,170,0,.85);text-transform:uppercase;}
.ana-dots i{font-style:normal;animation:dotBlink 1.2s infinite;}
.ana-dots i:nth-child(2){animation-delay:.2s}
.ana-dots i:nth-child(3){animation-delay:.4s}
@keyframes dotBlink{0%,60%,100%{opacity:.15}30%{opacity:1}}
.ana-bar{display:flex;align-items:center;gap:4px;margin:3px 4px 0;}
.ana-track{flex:1;height:5px;border-radius:4px;background:rgba(0,255,65,.1);
  border:1px solid rgba(0,255,65,.3);overflow:hidden;}
.ana-fill{height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#00a844,#00ff88,#c9ffdd);
  box-shadow:0 0 8px rgba(0,255,136,.6);}
.ana-pct{font-size:8.5px;font-weight:900;color:#00ff88;min-width:26px;text-align:right;
  font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<script>
/* ============================================================
   CONFIGURATION & SERVER CONNECTIONS
============================================================ */
const ACCESS_KEY     = "VIP1009";
const ROUND_SECONDS  = 30;
const ANALYZE_TIME   = 3000;
const PANEL_EARLY    = 3;

/* FIREBASE CONFIGURATION */
const firebaseConfig = {
  apiKey: "AIzaSyBPBQOeApFZQwGX8G4mZxhY5C2jjN6VWmU",
  authDomain: "dkwin-panel-ai.firebaseapp.com",
  databaseURL: "https://dkwin-panel-ai-default-rtdb.firebaseio.com",
  projectId: "dkwin-panel-ai",
  storageBucket: "dkwin-panel-ai.firebasestorage.app",
  messagingSenderId: "925573387640",
  appId: "1:925573387640:web:8faf648b0b89933c89e48d"
};

let db = null, fbOK = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  fbOK = true;
}catch(e){ console.warn('Firebase connection failed, using local mode.', e); }

/* ============================================================
   STATE & DOM ELEMENTS
============================================================ */
let isLoggedIn=false, period=0;
let pending=null, lastRem=null, analyzeTO=null, anaInt=null;
const $ = id => document.getElementById(id);
const panel       = $('signalPanel');
const lockScr     = $('lockScreen'), offlineScr = $('offlineScreen'), liveScr = $('liveScreen');
const timerEl     = $('timer'), periodEl = $('periodNum');
const sigNumberEl = $('signalNumber'), numBadgeEl = $('numBadge'), accTextEl = $('accText');
const sigWrap     = $('signalWrap'), badge = $('matchBadge');
const anaBox      = $('analyzingBox'), anaFill = $('anaFill'), anaPct = $('anaPct');
const sigCircle   = $('sigCircle'), resOverlay = $('resultOverlay');

const pad = n => String(n).padStart(2,'0');

/* MARKET PERIOD GENERATOR */
function getMarketPeriod(){
  const now = new Date();
  const y = now.getFullYear();
  const m = pad(now.getMonth()+1);
  const d = pad(now.getDate());
  const secToday = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
  const roundToday = Math.floor(secToday / ROUND_SECONDS) + 1;
  const roundStr = String(roundToday).padStart(4, '0');
  return '' + y + m + d + roundStr;
}

function showScreen(which){
  lockScr.style.display     = which==='lock'?'flex':'none';
  offlineScr.style.display  = which==='offline'?'flex':'none';
  liveScr.style.display     = which==='live'?'flex':'none';
}
function showAnalyzingUI(){
  anaBox.style.display='block';
  sigWrap.style.display='none';
  badge.textContent='WAITING'; badge.className='WAIT';
}
function showSignalUI(){
  anaBox.style.display='none';
  sigWrap.style.display='flex';
}

/* NETWORK CONNECTIVITY CHECK (Hide panel if no internet) */
function updatePanelVisibility(){
  if(navigator.onLine){
    panel.style.display = 'flex';
  } else {
    panel.style.display = 'none';
    isLoggedIn = false;
    clearTimeout(analyzeTO);
    clearInterval(anaInt);
    pending = null;
    sigCircle.classList.remove('on');
  }
}

/* ============================================================
   SERVER SIGNAL FETCHING LOGIC WITH NUMBER SHORTS
============================================================ */
function fetchServerSignal(){
  if(!navigator.onLine) return null;
  
  const p = getMarketPeriod();
  const hash = p.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
  
  /* Number prediction (0-9) */
  const num = hash % 10;
  const size = (num >= 5) ? 'BIG' : 'SMALL';
  const accuracy = (88 + (hash % 11)).toFixed(1);

  return { size, num, accuracy };
}

/* ROUND ENGINE CONTROLLER */
setInterval(()=>{
  const rem = ROUND_SECONDS - (new Date().getSeconds() % ROUND_SECONDS);
  if(lastRem!==null && rem>lastRem) onRoundStart();
  lastRem = rem;

  if(isLoggedIn && navigator.onLine){
    const panelRem = Math.max(0, rem - PANEL_EARLY);
    timerEl.textContent = '00:'+pad(panelRem);
  }
},250);

function onRoundStart(){
  if(!isLoggedIn || !navigator.onLine) return;
  checkRoundResult(); // Show WIN/LOSS for previous round
  period++;
  periodEl.textContent = '#' + getMarketPeriod();
  startAnalyzing();
}

/* ANALYZING STEP */
function startAnalyzing(){
  clearTimeout(analyzeTO); clearInterval(anaInt);
  showAnalyzingUI();
  sigCircle.classList.remove('on');

  anaFill.style.transition='none'; anaFill.style.width='0%';
  let p=0; anaPct.textContent='0%';
  void anaFill.offsetWidth;
  anaFill.style.transition='width '+ANALYZE_TIME+'ms linear';
  anaFill.style.width='100%';
  anaInt=setInterval(()=>{
    p+=100/(ANALYZE_TIME/100);
    if(p>=100){p=100; clearInterval(anaInt);}
    anaPct.textContent=Math.round(p)+'%';
  },100);

  analyzeTO=setTimeout(generateSignal, ANALYZE_TIME);
}

/* SIGNAL GENERATION STEP */
function generateSignal(){
  clearInterval(anaInt);

  const data = fetchServerSignal();
  if(!data){
    showScreen('offline');
    isLoggedIn=false;
    return;
  }

  showSignalUI();
  pending = { period: getMarketPeriod(), size: data.size, num: data.num };

  sigNumberEl.textContent = data.size;
  numBadgeEl.textContent  = 'NUM: ' + data.num;
  accTextEl.textContent   = 'ACCURACY: ' + data.accuracy + '%';
  
  $('sigPeriodNum').textContent = '#' + getMarketPeriod();

  badge.textContent = 'SIGNAL READY ✓';
  badge.className   = 'READY';

  sigCircle.classList.add('on');

  /* SYNC SIGNAL TO FIREBASE */
  if(fbOK) try{
    db.ref('signals_30s').set({
      period: getMarketPeriod(), size: data.size, num: data.num, ts: Date.now()
    });
  }catch(e){}
}

/* RESULT CHECKER (WIN/LOSS ANIMATION) */
function checkRoundResult(){
  if(!pending) return;
  
  /* Simulating Independent Result Validation */
  const isWin = Math.random() > 0.35; // Result simulation
  
  resOverlay.className = isWin ? 'WIN' : 'LOSS';
  $('resTitle').textContent = isWin ? 'WIN 🎯' : 'LOSS ❌';
  $('resSub').textContent = isWin ? 'ACCURATE SIGNAL' : 'NEXT ROUND READY';
  resOverlay.style.display = 'flex';

  setTimeout(()=>{
    resOverlay.style.display = 'none';
  }, 2200);

  pending = null;
}

/* UNLOCK FUNCTION */
function unlock(){
  if($('keyInput').value === ACCESS_KEY){
    const test = fetchServerSignal();
    if(!test){
      showScreen('offline');
      $('keyErr').style.display='none';
      return;
    }
    isLoggedIn = true;
    $('keyErr').style.display='none';
    goLive();
  }else{
    $('keyErr').style.display='block';
    lockScr.classList.remove('shake'); void lockScr.offsetWidth;
    lockScr.classList.add('shake');
  }
  $('keyInput').value='';
}
$('btnUnlock').onclick = unlock;
$('keyInput').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });

function goLive(){
  showScreen('live');
  period++;
  periodEl.textContent = '#' + getMarketPeriod();
  lastRem=null;
  startAnalyzing();
}

/* ONLINE/OFFLINE EVENT HANDLERS */
window.addEventListener('offline', updatePanelVisibility);
window.addEventListener('online', ()=>{
  updatePanelVisibility();
  if(isLoggedIn){
    goLive();
  } else {
    showScreen('lock');
  }
});

/* TOP TICKER GENERATOR */
(function(){
  let t='⚡ HGZY iIGNICE • WIN 30 SECONDS MARKET • NUMBER SHORT SIGNALS • HIGH ACCURACY ACCORDING TO SERVER DATA ⚡ ';
  document.querySelectorAll('.ticker-item').forEach(e=>e.textContent=t.repeat(2));
})();

/* DRAGGABLE PANEL IMPLEMENTATION */
(function makeDraggable(p){
  let ox=0, oy=0, drag=false;
  const W=10;
  const start=(x,y)=>{const r=p.getBoundingClientRect();ox=x-r.left;oy=y-r.top;drag=true;};
  const move =(x,y)=>{
    if(!drag) return;
    let l=x-ox, t=y-oy;
    l=Math.max(W,Math.min(innerWidth -p.offsetWidth -W,l));
    t=Math.max(24,Math.min(innerHeight-p.offsetHeight,t));
    p.style.left=l+'px'; p.style.top=t+'px';
  };
  p.addEventListener('touchstart',e=>start(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  p.addEventListener('touchmove', e=>{move(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
  p.addEventListener('touchend',()=>drag=false);
  p.addEventListener('mousedown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
    start(e.clientX,e.clientY); e.preventDefault();
  });
  document.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  document.addEventListener('mouseup',()=>drag=false);
  
  p.style.left=Math.max(W,(innerWidth-p.offsetWidth)/2)+'px';
  p.style.top='50px';
})(panel);

/* INITIALIZATION */
updatePanelVisibility();                
if(navigator.onLine){
  showScreen('lock');
  periodEl.textContent = '#' + getMarketPeriod();
}
</script>
